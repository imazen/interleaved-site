<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{#if title}}{{title}} — {{site.name}}{{else}}{{site.name}} — {{site.tagline}}{{/if}}</title>
<meta name="description" content="{{#if description}}{{description}}{{else}}{{site.description}}{{/if}}">
<meta property="og:title" content="{{#if title}}{{title}} — {{site.name}}{{else}}{{site.name}}{{/if}}">
<meta property="og:description" content="{{site.description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="https://interleaved.org">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fg: #111;
    --fg2: #555;
    --fg3: #888;
    --bg: #fff;
    --bg2: #f8f9fa;
    --accent: #16a34a;
    --accent2: #15803d;
    --border: #e5e7eb;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f1f1f1;
      --fg2: #aaa;
      --fg3: #777;
      --bg: #111;
      --bg2: #1a1a1a;
      --accent: #4ade80;
      --accent2: #22c55e;
      --border: #2a2a2a;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent2); }
  .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius);
    font-weight: 600; font-size: 15px;
    transition: all 0.15s;
    text-decoration: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); color: #fff; }
  .btn-outline { border: 1px solid var(--border); color: var(--fg); }
  .btn-outline:hover { border-color: var(--fg3); }
  code {
    background: var(--bg2); padding: 2px 6px;
    border-radius: 4px; font-size: 0.9em;
    font-family: "JetBrains Mono", "Fira Code", monospace;
  }
  pre { background: var(--bg2); padding: 16px; border-radius: var(--radius); overflow-x: auto; margin: 24px 0; }
  pre code { background: none; padding: 0; }
</style>
